<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Health Dashboard — Login</title>

  <!-- CSS -->
  <link rel="stylesheet" href="AILogin.css" />

  <!-- JS -->
  <script defer src="AILogin.js"></script>
</head>
<body>

  <!-- ====== Top Navigation Bar ====== -->
  <header class="topbar">
    <h2>AI Universal Health & Fitness Assistant</h2>
    <div class="user-actions">
      <a href="#" id="loginBtn" class="btn small">🔐 Log in</a>
      <a href="#" id="logoutBtn" class="btn small logout">🚪 Log out</a>
      <div class="user-profile">
        <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="User" class="profile-icon">
      </div>
    </div>
  </header>

  <!-- ====== Auth Section ====== -->
  <div class="auth-container">
    <div class="auth-box">
      <div class="brand">
        <img src="https://cdn-icons-png.flaticon.com/512/2920/2920313.png" class="logo" alt="AI Logo">
        <h1>AI Universal Health Assistant</h1>
        <p class="muted">Smart Health • Fitness • AI Demo</p>
      </div>

      <div class="tabs">
        <button id="loginTab" class="active">Login</button>
        <button id="signupTab">Sign Up</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="form active">
        <input type="email" id="loginEmail" placeholder="Email" required />
        <input type="password" id="loginPassword" placeholder="Password" required />
        <button type="submit" class="btn primary">Login</button>
        <p class="switchText">Don’t have an account? <a href="#" id="goSignup">Sign Up</a></p>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signupForm" class="form">
        <input type="text" id="signupName" placeholder="Full Name" required />
        <input type="email" id="signupEmail" placeholder="Email" required />
        <input type="password" id="signupPassword" placeholder="Password" required />
        <button type="submit" class="btn primary">Create Account</button>
        <p class="switchText">Already have an account? <a href="#" id="goLogin">Login</a></p>
      </form>

      <div class="footer muted">
        © 2025 • AI Health Assistant • Demo by Sahil
      </div>
    </div>
  </div>

</body>
</html>
